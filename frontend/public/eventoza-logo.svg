    <!-- Confetti -->
    <g fill="#F34B73">
      <rect x="126" y="91" width="8" height="15" rx="3" transform="rotate(-38 130 98)"/>
      <rect x="170" y="118" width="8" height="13" rx="3" transform="rotate(43 174 124)"/>
      <rect x="274" y="151" width="8" height="14" rx="3" transform="rotate(39 278 158)"/>
    </g>
    <g fill="#F4B52C">
