      M95 75
      C108 65 127 59 150 59
      L150 75
      C131 77 116 84 106 95
      C98 104 94 116 94 132
      L94 205
      C105 222 123 239 143 251
      C161 263 183 269 206 269
      L333 269
      C331 287 326 306 316 331
      L177 331
      C153 331 133 325 118 315
      C102 304 94 291 94 275
      Z"/>

    <!-- Re-cut purple outer contour -->
