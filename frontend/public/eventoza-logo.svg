      L177 331
      C207 331 232 319 249 297
      C258 285 264 271 268 255
      L170 255
      C149 255 132 249 118 237
      C102 223 94 207 94 187
      L94 110
      C94 96 101 83 113 74
      C126 64 143 59 163 59
      L279 59
      C288 46 295 31 299 12
      Z"/>

    <!-- Pink lower ribbon -->
    <path fill="url(#pink)" d="
      M94 205
      L94 275
      C94 291 103 304 118 315
      C131 325 148 331 170 331
      L316 331
      C326 314 331 293 333 269
      L206 269
      C183 269 161 263 143 251
      C124 239 107 222 94 205
      Z"/>

    <!-- Golden sweeping ribbon -->
    <path fill="url(#gold)" d="
      M22 225
      C42 204 67 184 95 167
      C133 143 169 128 204 105
      C218 96 230 87 241 75
      C233 102 218 123 196 140
      C170 159 137 172 110 190
      C76 211 52 234 36 256
      C29 248 24 237 22 225
      Z"/>

    <!-- Inner white stage -->
