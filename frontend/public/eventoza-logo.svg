      <rect x="251" y="103" width="9" height="13" rx="3" transform="rotate(45 255 109)"/>
    </g>

    <!-- Star -->
    <path fill="#F2B32A" d="M303 60 L309 78 L328 84 L309 90 L303 108 L297 90 L278 84 L297 78 Z"/>
  </g>

  <!-- Wordmark -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="800" letter-spacing="4">
    <text x="500" y="565" text-anchor="middle" font-size="82" fill="#061B3D">
      EVENTOZ<tspan fill="#F04C70">A</tspan>
    </text>
  </g>

  <!-- Wordmark sparkle -->
  <path fill="#F2B32A" d="M872 495 L878 512 L896 518 L878 524 L872 542 L866 524 L848 518 L866 512 Z"/>

  <!-- Tagline -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="500" letter-spacing="8">
    <text x="500" y="622" text-anchor="middle">
      <tspan fill="#5121B9">PLAN</tspan>
      <tspan fill="#6D7280"> • </tspan>
      <tspan fill="#F04C70">MANAGE</tspan>
      <tspan fill="#6D7280"> • </tspan>
      <tspan fill="#E4A82A">CELEBRATE</tspan>
    </text>
  </g>

  <!-- Divider -->
  <line x1="140" y1="670" x2="860" y2="670" stroke="#D9DDE4" stroke-width="2"/>

  <!-- Descriptor -->
  <text x="500" y="723" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="23" font-weight="500" letter-spacing="9"
        fill="#27354E">EVENT MANAGEMENT PLATFORM</text>
</svg>
