      L299 12 C295 31 288 46 279 59 L163 59
      C143 59 126 64 113 74 C101 83 94 96 94 110
      L94 205 C82 187 72 171 65 154
      C58 136 55 118 58 101
      C61 84 70 70 82 59
      C65 63 51 73 42 87
      C33 101 29 119 29 140
      L29 238
      C29 258 37 277 52 291
      C66 304 84 312 109 312
      L177 312
      C195 312 212 307 226 298
      C212 319 190 331 159 331
      L109 331 C77 331 48 318 31 293 C20 277 15 257 15 238 Z"/>

    <!-- Gold ribbon on top -->
    <path fill="url(#gold)" d="
      M6 222
      C32 198 62 176 97 157
      C132 138 166 126 198 105
      C218 92 232 80 243 64
      C237 89 224 112 204 130
      C180 151 149 164 118 181
      C81 201 51 224 27 251
      C17 243 10 233 6 222 Z"/>

    <!-- Celebration silhouettes -->
    <g fill="#071A3A">
      <!-- Adult -->
      <circle cx="178" cy="184" r="16"/>
      <path d="M157 205 C164 198 192 198 200 208 L203 253 L151 253 Z"/>
      <path d="M160 210 L133 177 L140 171 L169 201 Z"/>
      <path d="M196 208 L221 166 L229 171 L207 218 Z"/>
      <path d="M157 247 L151 277 L163 277 L174 248 Z"/>
      <path d="M191 247 L199 277 L211 277 L201 246 Z"/>

      <!-- Child -->
      <circle cx="250" cy="211" r="12"/>
      <path d="M235 228 C241 222 260 222 266 230 L270 267 L230 267 Z"/>
      <path d="M239 232 L218 207 L224 202 L247 225 Z"/>
      <path d="M263 232 L282 207 L288 212 L270 245 Z"/>
      <path d="M239 262 L235 283 L245 283 L250 263 Z"/>
      <path d="M259 262 L264 283 L274 283 L269 262 Z"/>
