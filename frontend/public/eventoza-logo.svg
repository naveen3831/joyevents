<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 880" role="img" aria-labelledby="title desc">
  <title id="title">Eventoza Event Management Platform Logo</title>
  <desc id="desc">A colorful stylized E-shaped event logo with celebrating silhouettes and Eventoza wordmark.</desc>

  <defs>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7028D9"/>
      <stop offset="55%" stop-color="#5420C7"/>
      <stop offset="100%" stop-color="#35159C"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD45A"/>
      <stop offset="100%" stop-color="#E9A51B"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF3F72"/>
      <stop offset="100%" stop-color="#F34B73"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#18213A" flood-opacity=".12"/>
    </filter>
  </defs>

